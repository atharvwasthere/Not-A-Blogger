name: Deploy Backend to Cloudflare Containers

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-backend.yml'

env:
  IMAGE_NAME: atharv19/not-a-blogger-api

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── 2. Login to Docker Hub ───────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Build & push Docker image (linux/amd64, required by Cloudflare
      #      Containers) — tagged with both the Git short SHA and 'latest'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 4. Point wrangler.jsonc at the new image tag ─────────────────────
      - name: Update container image tag
        run: |
          sed -i -E "s#(\"image\": \"docker\.io/${IMAGE_NAME//\//\\/}):[^\"]+\"#\1:${{ steps.vars.outputs.sha_short }}\"#" cloudflare/wrangler.jsonc

      # ── 5. Deploy to Cloudflare ───────────────────────────────────────────
      - name: Install wrangler deps
        working-directory: cloudflare
        run: npm ci

      - name: Generate Worker types
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf-typegen

      - name: Deploy with wrangler
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
