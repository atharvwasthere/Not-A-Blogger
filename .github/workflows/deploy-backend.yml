name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Never run two deploys against the same box at once
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: atharv19/not-a-blogger-api

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── 2. Login to Docker Hub ───────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Build & push image (linux/amd64 for the t3 instance) ─────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 4. SSH access to the box ─────────────────────────────────────────
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.EC2_HOST }} ${{ secrets.EC2_HOST_KEY }}" > ~/.ssh/known_hosts

      # ── 5. Pull, migrate, restart; roll back if the new image is unhealthy
      - name: Deploy to EC2
        env:
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} TAG="$TAG" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/notablogger
          PREVIOUS=$(cat tag.env)
          echo "API_TAG=$TAG" > tag.env
          compose() { sudo docker compose --env-file tag.env "$@"; }

          compose pull -q api
          compose run --rm api alembic upgrade head
          compose up -d api

          for i in $(seq 1 30); do
            curl -sf localhost:8000/ >/dev/null && { echo "healthy on $TAG"; sudo docker image prune -af >/dev/null; exit 0; }
            sleep 2
          done

          # Migrations are not reverted: they must stay compatible with the previous image
          echo "unhealthy on $TAG, rolling back to $PREVIOUS"
          compose logs --tail 50 api
          echo "$PREVIOUS" > tag.env
          compose up -d api
          exit 1
          EOF
